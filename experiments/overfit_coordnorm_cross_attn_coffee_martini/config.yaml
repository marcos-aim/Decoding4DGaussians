experiment:
  name: overfit_coordnorm_cross_attn_coffee_martini
  scene: coffee_martini
  mode: cross_attention_deformation
  # CHANGE: Scene-normalized coordinates (center + scale, no PCA rotation)

paths:
  neu3d_scene: D:\DecodeGaussians\datasets\neu3d\coffee_martini
  spatracker_root: D:\DecodeGaussians\SpaTrackerV2
  cache_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\cache
  checkpoint_dir: D:\DecodeGaussians\experiments\overfit_coordnorm_cross_attn_coffee_martini\checkpoints
  render_dir: D:\DecodeGaussians\experiments\overfit_coordnorm_cross_attn_coffee_martini\renders
  log_dir: D:\DecodeGaussians\experiments\overfit_coordnorm_cross_attn_coffee_martini\logs
  # NO canonical checkpoint — must retrain stage 1 in normalized coords
  # canonical_checkpoint: (none — train from scratch)

data:
  resolution: [512, 384]
  input_camera: cam01
  eval_camera: cam00
  num_frames: 300
  precompute_window: 8

model:
  num_gaussians_per_patch: 128
  canonical:
    dim_in: 2048
    dim_hidden: 1024
    sh_degree: 0
  deformation:
    dim_canonical: 1024
    dim_tokens: 2048
    dim_hidden: 256
    n_heads: 8
    n_layers: 3
    max_displacement: 2.0

coordinate_normalization:
  enabled: true
  mode: hybrid  # center + scale only, no PCA rotation
  # These are computed at runtime from the point cloud:
  # center: median of all points across all frames
  # scale: 1 / (max pairwise camera distance) or 1 / scene_extent

training:
  batch_frames: 1
  supervision_cams: 4
  grad_clip_max_norm: 1.0
  scale_anneal_target: 0.5
  stage1:
    steps: 20000
    lr: 1.0e-3
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      geo: 0.1
      depth: 0.0
      scale_reg: 0.01
      opacity_reg: 0.01
  stage2:
    steps: 20000
    lr: 5.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.01
      scale_reg: 0.01
      opacity_reg: 0.005
  stage3:
    steps: 10000
    lr: 1.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.005
      scale_reg: 0.01
      opacity_reg: 0.005
  checkpointing:
    save_every: 2000
    render_every: 500

vram:
  total_gb: 12.0
  warn_threshold_gb: 10.5
  oom_retry: true
