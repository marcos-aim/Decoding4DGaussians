# Multi-scene training configuration
# Trains on multiple datasets with gradient accumulation

experiment_name: "multi_scene_training"

# Scenes to train on
scenes:
  - name: "coffee_martini"
    cache_dir: "/home/codyreeth/Desktop/Decoding4DGaussians/experiments/overfit_twoscene/cache_coffee_martini"
    poses_bounds_path: "/home/codyreeth/Desktop/Decoding4DGaussians/datasets/neu3d/coffee_martini/poses_bounds.npy"
    input_camera: "cam01"
    eval_camera: "cam00"
    weight: 1.0

  - name: "cook_spinach"
    cache_dir: "/home/codyreeth/Desktop/Decoding4DGaussians/experiments/overfit_twoscene/cache_cook_spinach"
    poses_bounds_path: "/home/codyreeth/Desktop/Decoding4DGaussians/datasets/neu3d/cook_spinach/poses_bounds.npy"
    input_camera: "cam01"
    eval_camera: "cam00"
    weight: 1.0

    
  - name: "cut_roasted_beef"
    cache_dir: "/home/codyreeth/Desktop/Decoding4DGaussians/experiments/overfit_twoscene/cache_cut_roasted_beef"
    poses_bounds_path: "/home/codyreeth/Desktop/Decoding4DGaussians/datasets/neu3d/cut_roasted_beef/poses_bounds.npy"
    input_camera: "cam01"
    eval_camera: "cam00"
    weight: 1.0

# Model configuration
model:
  dim_tokens: 2048
  dim_canonical_hidden: 1024
  dim_deformation_hidden: 256
  num_gaussians_per_patch: 64
  sh_degree: 0
  n_attn_heads: 8
  n_attn_layers: 2
  max_displacement: 2.0
  use_cross_attention: true

# Training configuration
training:
  # Stage 1: Canonical head only
  stage1_steps: 20000
  stage1_lr: 0.0005
  stage1_batch_frames: 1
  stage1_supervision_cams: 4

  # Stage 2: Deformation head only
  stage2_steps: 20000
  stage2_lr: 0.0005
  stage2_batch_frames: 4  # CRITICAL: Must be >1 for temporal learning
  stage2_supervision_cams: 4
  stage2_loss_weights:
    photometric: 1.0
    tv: 0.01  # Temporal variation loss for smooth deformations

  # Stage 3: Joint fine-tuning
  stage3_steps: 5000
  stage3_lr: 0.0001
  stage3_batch_frames: 4  # CRITICAL: Must be >1 for temporal learning
  stage3_supervision_cams: 4
  stage3_loss_weights:
    photometric: 1.0
    tv: 0.01  # Temporal variation loss for smooth deformations

  # Optimization
  grad_clip_max_norm: 1.0
  weight_decay: 0.0

  # Evaluation and checkpointing
  eval_every: 500
  save_ckpt_every: 1000

# Rendering configuration
rendering:
  image_width: 512
  image_height: 384
  bg_color: [0.0, 0.0, 0.0]
  scale_modifier: 1.0

# Coordinate normalization (critical for multi-scene!)
normalization:
  enabled: true
  method: "unit_cube"  # Normalize each scene to [-1, 1]³

# Logging
logging:
  log_dir: "./logs"
  render_dir: "./renders"
  ckpt_dir: "./checkpoints"
  log_loss_every: 10
  save_render_every: 500
