experiment:
  name: overfit_sh1_cross_attn_coffee_martini
  scene: coffee_martini
  mode: cross_attention_deformation
  # CHANGE: sh_degree 0 -> 1 (4 SH coefficients instead of 1 DC-only)

paths:
  neu3d_scene: D:\DecodeGaussians\datasets\neu3d\coffee_martini
  spatracker_root: D:\DecodeGaussians\SpaTrackerV2
  cache_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\cache  # reuse cached data
  checkpoint_dir: D:\DecodeGaussians\experiments\overfit_sh1_cross_attn_coffee_martini\checkpoints
  render_dir: D:\DecodeGaussians\experiments\overfit_sh1_cross_attn_coffee_martini\renders
  log_dir: D:\DecodeGaussians\experiments\overfit_sh1_cross_attn_coffee_martini\logs
  # Stage 1 checkpoint from original experiment (sh_degree=0 canonical)
  # NOTE: canonical head has sh_degree=0 weights; we retrain canonical with sh_degree=1
  canonical_checkpoint: D:\DecodeGaussians\experiments\overfit_coffee_martini\checkpoints\stage1_final.pt

data:
  resolution: [512, 384]
  input_camera: cam01
  eval_camera: cam00
  num_frames: 300
  precompute_window: 8

model:
  num_gaussians_per_patch: 128
  canonical:
    dim_in: 2048
    dim_hidden: 1024
    sh_degree: 1  # CHANGED from 0 — 4 SH coefficients per color channel
  deformation:
    dim_canonical: 1024
    dim_tokens: 2048
    dim_hidden: 256
    n_heads: 8
    n_layers: 3
    max_displacement: 2.0

training:
  batch_frames: 1
  supervision_cams: 4
  grad_clip_max_norm: 1.0
  scale_anneal_target: 0.5
  stage2:
    steps: 20000
    lr: 5.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.01
      scale_reg: 0.01
      opacity_reg: 0.005
  stage3:
    steps: 10000
    lr: 1.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.005
      scale_reg: 0.01
      opacity_reg: 0.005
  checkpointing:
    save_every: 2000
    render_every: 500

vram:
  total_gb: 12.0
  warn_threshold_gb: 10.5
  oom_retry: true
