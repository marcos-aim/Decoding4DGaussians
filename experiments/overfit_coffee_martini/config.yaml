experiment:
  name: overfit_coffee_martini
  scene: coffee_martini
  mode: aggregator_only  # or aggregator_plus_tracker

paths:
  neu3d_scene: D:\DecodeGaussians\datasets\neu3d\coffee_martini
  spatracker_root: D:\DecodeGaussians\SpaTrackerV2
  cache_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\cache
  checkpoint_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\checkpoints
  render_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\renders
  log_dir: D:\DecodeGaussians\experiments\overfit_coffee_martini\logs

data:
  resolution: [512, 384]  # W, H
  input_camera: cam01
  eval_camera: cam00
  num_frames: 300
  precompute_window: 8  # frames per STV2 forward pass

model:
  num_gaussians_per_patch: 128  # 1041*128 = 133,248 Gaussians (SH=0 allows more K)
  canonical:
    dim_in: 2048
    dim_hidden: 1024
    sh_degree: 0  # DC only — prevents view-dependent SH overfitting
  deformation:
    dim_in: 2048
    dim_hidden: 256
    n_attn_heads: 8
    n_attn_layers: 2

training:
  batch_frames: 1
  supervision_cams: 4  # multi-view is critical for novel view quality
  grad_clip_max_norm: 1.0
  ssim_warmup_steps: 500
  lpips_warmup_steps: 1000
  stage1_supervision_cams: 4
  scale_anneal_start: 5000
  scale_anneal_target: 0.5
  stage1:
    steps: 20000
    lr: 1.0e-3
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      geo: 0.1
      depth: 0.0
      scale_reg: 0.01
      opacity_reg: 0.01
      lpips: 0.0
  stage2:
    steps: 15000
    lr: 5.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.01
      scale_reg: 0.01
      opacity_reg: 0.01
  stage3:
    steps: 10000
    lr: 2.0e-4
    loss_weights:
      rgb: 1.0
      ssim: 0.85
      tv: 0.005
      scale_reg: 0.01
      opacity_reg: 0.01
  checkpointing:
    save_every: 2000
    render_every: 500

vram:
  total_gb: 12.0
  warn_threshold_gb: 10.5
  oom_retry: true
